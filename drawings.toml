# Every drawing in this repo is one entry here: a STEP file plus the draftwright CLI
# arguments used to build it. There is no per-drawing code, patching or post-processing —
# `build.py` passes exactly these arguments to the stock `draftwright` CLI.
#
# `args` below is prepended to every drawing's own `args`.

args = ["--format", "pdf", "--no-progress"]

[[drawing]]
name = "nist-ctc-01"
step = "steps/nist/nist_ctc_01_asme1_ap242.stp"
args = ["--title", "NIST CTC-01", "--number", "NIST-CTC-01"]

