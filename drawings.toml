# Every drawing in this repo is one entry here: a STEP file plus what goes in its title
# block. There is no per-drawing code, patching or post-processing: `build.py` writes the
# title block into a minimal draftwright Spec beside the drawing and runs the stock
# `draftwright render` and `draftwright review` commands on it.
#
# `draftwright` is the pzfreo/draftwright-rust release tag that builds every drawing. CI
# installs exactly that tag; changing it here is what rebuilds the drawings.

draftwright = "v0.2.4"
formats = ["pdf"]

