version: 2
updates:
  # The draftwright pin in pyproject.toml/uv.lock. A new release opens a PR here, whose
  # Drawings check rebuilds everything against it; merging rebuilds and commits the output.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, draftwright]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
