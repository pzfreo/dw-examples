name: Drawings

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - drawings.toml
      - build.py
      - steps/**
      - .github/workflows/drawings.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - drawings.toml
      - build.py
      - steps/**
      - .github/workflows/drawings.yml
  workflow_dispatch:

# A Dependabot PR bumping the draftwright pin builds the drawings as a check; merging it
# reaches the main-push branch below, which rebuilds them and commits the result.

concurrency:
  group: drawings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Needed only by the commit step, which runs on main pushes and manual dispatch.
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the pinned draftwright
        run: uv sync --frozen
      - name: Report the draftwright version
        run: uv run draftwright --version
      - name: Rebuild every drawing
        run: uv run python build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: drawings
          path: drawings/
      - name: Commit rebuilt drawings
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- drawings; then
            echo "drawings unchanged"
            exit 0
          fi
          version=$(uv run draftwright --version | awk '{print $NF}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drawings
          git commit -m "Rebuild drawings with draftwright ${version}"
          git push
