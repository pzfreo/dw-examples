name: Drawings

on:
  pull_request:
    paths:
      - drawings.toml
      - build.py
      - steps/**
      - .github/workflows/drawings.yml
  workflow_dispatch:

# A PR that changes the manifest, build script or STEP files builds the drawings and commits
# them to the PR branch, so the PDFs can be reviewed in the PR and are on main the moment it
# merges. Main does not rebuild on merge; run the workflow by hand on main for a full rebuild.
# PRs from forks build as a check only: the token cannot push to a fork's branch.

concurrency:
  group: drawings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Needed only by the commit step.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a PR, check out the branch itself (not the merge commit) so the build can be
          # committed back to it.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
      - name: Read the draftwright tag
        id: dw
        run: echo "tag=$(python3 -c 'import tomllib;print(tomllib.load(open("drawings.toml","rb"))["draftwright"])')" >> "$GITHUB_OUTPUT"
      # draftwright-rust publishes no binaries, so the CLI is built from its tag once and cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ~/.local/draftwright
          key: draftwright-${{ steps.dw.outputs.tag }}-${{ runner.os }}
      - name: Install draftwright ${{ steps.dw.outputs.tag }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.dw.outputs.tag }}" https://github.com/pzfreo/draftwright-rust "$RUNNER_TEMP/draftwright-rust"
          # The repository's rust-toolchain.toml picks the toolchain.
          cd "$RUNNER_TEMP/draftwright-rust"
          rustup toolchain install
          cargo install --locked --path . --bin draftwright --root ~/.local/draftwright
      - run: echo "$HOME/.local/draftwright/bin" >> "$GITHUB_PATH"
      - name: Rebuild every drawing
        run: python3 build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: drawings
          path: drawings/
      - name: Commit rebuilt drawings
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if git diff --quiet -- drawings && [ -z "$(git ls-files --others --exclude-standard drawings)" ]; then
            echo "drawings unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drawings
          git commit -m "Rebuild drawings with draftwright ${{ steps.dw.outputs.tag }}"
          git push
