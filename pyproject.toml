[project]
name = "dw-examples"
version = "0.1.0"
description = "Prebuilt draftwright drawings for standard STEP files"
requires-python = ">=3.12,<3.13"
# Pinned exactly so Dependabot raises a PR for every draftwright release; merging that
# PR is what triggers the rebuild of every drawing in drawings.toml.
dependencies = ["draftwright==0.4.32"]

[tool.uv]
package = false
